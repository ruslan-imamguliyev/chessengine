[project]
name = "chessengine"
version = "0.1.0"
description = ""
authors = [
    {name = "ruslol228",email = "ruslanimamkuliev06@gmail.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = [
    "pandas (>=2.3.3,<3.0.0)",
    "numpy (>=2.3.5,<3.0.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
    "python-box (>=7.3.2,<8.0.0)",
    "chess (>=1.11.2,<2.0.0)",
    "notebook (>=7.5.3,<8.0.0)",
    "torch (>=2.10.0,<3.0.0)",
    "modal (>=1.3.4,<2.0.0)",
    "matplotlib (>=3.10.8,<4.0.0)",
    "mlflow (>=3.9.0,<4.0.0)",
    "notebook (>=7.5.0,<8.0.0)",
    "kagglehub (>=0.3.13,<0.4.0)"
]

[tool.poetry]
package-mode = false

[[tool.poetry.source]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
priority = "explicit"


[tool.poetry.dependencies]
torch = {source = "pytorch-cu130"}
[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "kagglehub (>=0.3.13,<0.4.0)"
]
research = [
    "notebook (>=7.5.0,<8.0.0)",
]