data_ingestion:
  method: kagglehub
  available_methods:
    kagglehub:
      source: ronakbadhe/chess-evaluations
      install_path: dataset/raw/

data_preprocessing:
  input_path: dataset/raw/
  output_path: dataset/preprocessed/
  output_file: preprocessed.csv
  max_mate_value: 30000
  min_mate_value: 1000
  scaling_factor: 500


data_transformation:
  output_path: dataset/transformed/
  input_file: dataset/preprocessed/preprocessed.csv
  feature_filename: features
  target_filename: targets

dataset_entity:
  input_path: dataset/transformed/
  feature_filename: features_x.bin
  target_filename: targets_y.bin
  batch_size: 1024
  shuffle: True
  num_workers: 4
  # Set to 'null' to use the whole dataset
  num_samples: null